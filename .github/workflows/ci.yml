name: CI
# Every pull request and every push to main, each run through Bun: the build, types, lint and format; the
# tests with coverage; the Postgres entry against a real database; the packed packages as a project installs
# them; and every example's Worker running under vp dev.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every push to main keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CF_SEND_TELEMETRY: 'false'
jobs:
  verify:
    name: Build, types, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps, dependency install scripts among them, never see the job token.
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run verify

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The examples run against the packages' build, as a project installs them.
      - run: bun run build
      # Every package and example suite; under 90% lines, branches, functions or statements fails.
      - run: bun run test:coverage

  integration:
    name: Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The suite starts its own container from this image, which it never pulls itself.
      - run: docker pull postgres:18.6-trixie
      - run: bun run test:integration

  package:
    name: Packed packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      # Packs each package, installs it into a new project and creates starters that pass their own verify.
      - run: bun run verify:package

  e2e:
    name: Examples running
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bun run test:e2e
      - name: Keep the servers' output of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: .e2e/
          retention-days: 7
