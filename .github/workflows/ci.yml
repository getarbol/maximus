name: CI
# Builds, types, lint, format and OpenAPI checks run automatically. Tests and package scenarios run
# only when a person explicitly requests them through workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run test suites and package scenarios explicitly
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every push to main keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CF_SEND_TELEMETRY: 'false'
jobs:
  verify:
    name: Build, types, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps, dependency install scripts among them, never see the job token.
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run verify

  test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The examples run against the packages' build, as a project installs them.
      - run: bun run build
      # Every package and example suite; under 90% lines, branches, functions or statements fails.
      - run: bun run test:coverage

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    name: Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The workspace's Vite+ configuration loads every example, which imports the built package.
      - run: bun run build
      # The suite starts its own container from this image, which it never pulls itself.
      - run: docker pull postgres:18.6-trixie
      - run: bun run test:integration

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    name: Packed packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      # Packs each package, installs it into a new project and creates starters that pass their own verify.
      - run: bun run verify:package

  clients:
    name: OpenAPI clients
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Each committed document passes Redocly's strictest rules, and the TypeScript types openapi-typescript
      # writes from it compile; the tools are pinned, installed without their install scripts.
      - run: bun run check:clients

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    name: Examples running
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bun run test:e2e
      - name: Keep the servers' output of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: .e2e/
          retention-days: 7
