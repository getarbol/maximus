name: Publish Maximus
# Every push to main publishes the packages' version when npm does not have it yet; a manual run does the same.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # npm provenance, and npm trusted publishing once the package trusts this workflow.
  id-token: write
# One release at a time; a newer push waits instead of cancelling a publish in progress.
concurrency:
  group: publish-maximus
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps, dependency install scripts among them, never see the job token.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check whether npm already has this version
        id: release
        run: |
          version=$(node -p "require('./packages/maximus/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # npm view fails for a package that was never published and prints nothing for a missing version.
          if [ "$(npm view "@arbol-ai/maximus@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@arbol-ai/maximus@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.publish == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      # Release validation runs no tests; a human can request them in the verification workflow.
      - if: steps.release.outputs.publish == 'true'
        run: bun run verify:release
      - if: steps.release.outputs.publish == 'true'
        run: node scripts/publish.mjs
        env:
          # Empty when the package trusts this workflow instead; npm then publishes through OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Confirm the registry serves the published version
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        # The registry can take a few minutes to serve a new package or version. Both packages share it.
        run: |
          for package in @arbol-ai/maximus @arbol-ai/vite-plugin; do
            for attempt in $(seq 1 30); do
              [ "$(npm view "$package@$VERSION" version 2>/dev/null)" = "$VERSION" ] && break
              if [ "$attempt" = 30 ]; then
                echo "npm does not serve $package@$VERSION yet." >&2
                exit 1
              fi
              sleep 10
            done
          done
