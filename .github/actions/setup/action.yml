name: Set up the workspace
description: Bun, the Node.js that Cloudflare's local runtime needs, and the workspace's locked dependencies, installed without their install scripts.
inputs:
  node-version:
    description: The Node release the job runs on.
    default: '24'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    # Every command runs through Bun. Vite+ and Cloudflare's local runtime, Miniflare, run on Node.js
    # underneath: Miniflare reaches workerd through an undici dispatcher, which Bun's fetch does not take.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - run: bun install --frozen-lockfile --ignore-scripts
      shell: bash
