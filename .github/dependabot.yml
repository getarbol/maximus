version: 2
updates:
  # The workspace's dependencies, from bun.lock. Pinned versions stay pinned: each update is a pull
  # request that runs the verify workflow.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      toolchain:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
