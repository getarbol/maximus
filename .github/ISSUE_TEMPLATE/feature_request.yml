name: Feature request
description: A capability Maximus does not have yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to build, and what Maximus makes hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, and how it keeps the rules in CONTRIBUTING.md (one definition, one owner per check, tenancy by construction).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do today instead.
